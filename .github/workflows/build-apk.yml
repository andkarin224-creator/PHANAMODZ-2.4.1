name: Build PHANAMODZ APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ไม่พบไฟล์ ZIP"
            exit 1
          fi

          echo "ใช้ไฟล์: $ZIP_FILE"

          rm -rf android-project
          mkdir -p android-project
          unzip -o "$ZIP_FILE" -d android-project

          if [ ! -f "android-project/settings.gradle" ]; then
            echo "ไม่พบ settings.gradle"
            exit 1
          fi

          if [ ! -f "android-project/app/build.gradle" ]; then
            echo "ไม่พบ app/build.gradle"
            exit 1
          fi

          echo "PROJECT_DIR=android-project" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          APK=$(find "${{ env.PROJECT_DIR }}/app/build/outputs/apk" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ไม่พบ APK หลังจาก Build"
            exit 1
          fi

          echo "พบ APK: $APK"

          mkdir -p release
          cp "$APK" release/PHANAMODZ_2.4.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PHANAMODZ-2.4.1-APK
          path: release/PHANAMODZ_2.4.1.apk
          if-no-files-found: error
